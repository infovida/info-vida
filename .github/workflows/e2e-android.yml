name: E2E Android

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902
      - name: Build Android test binary
        run: npx expo prebuild --platform android --no-install && cd android && ./gradlew assembleRelease
      - name: Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash
      # Required by android-emulator-runner for accelerated Linux emulators.
      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record Android SDK diagnostics
        run: |
          mkdir -p artifacts/maestro
          command -v sdkmanager avdmanager > artifacts/maestro/sdk-tools.txt
          sdkmanager --version >> artifacts/maestro/sdk-tools.txt 2>&1
          avdmanager list device > artifacts/maestro/device-profiles.txt 2>&1
      - name: Start emulator and run flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          script: |
            mkdir -p artifacts/maestro
            adb logcat -c
            adb install android/app/build/outputs/apk/release/app-release.apk
            "$HOME/.maestro/bin/maestro" test --format junit --output artifacts/maestro/report.xml --debug-output artifacts/maestro .maestro/smoke.yaml || { adb logcat -d > artifacts/maestro/logcat.txt; exit 1; }
      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-artifacts-${{ github.sha }}
          path: artifacts/maestro/
          if-no-files-found: ignore
          retention-days: 14
